<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DEEJAY PAREDI — Tip &amp; Follow</title>
<meta name="description" content="Tip and follow Deejay Paredi — guitar, Latin, funk, grooves.">
<meta name="theme-color" content="#0b0a09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ====== EDIT THESE ====== */
:root{
  --accent:#ff5a1f;        /* electric orange — try #b6ff3b for acid green */
  --accent-ink:#140600;    /* text on the accent */
  --bg:#0b0a09;
  --ink:#f5f1ea;
  --muted:#a9a39a;
  --line:rgba(245,241,234,.14);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100svh;overflow-x:hidden}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}

/* ---- background: drifting blobs + wave lines + grain ---- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;will-change:transform}
.b1{width:420px;height:420px;left:-140px;top:-120px;background:radial-gradient(circle,var(--accent) 0%,transparent 65%);animation:drift1 22s ease-in-out infinite alternate}
.b2{width:360px;height:360px;right:-160px;top:38%;background:radial-gradient(circle,#7a2cff 0%,transparent 65%);opacity:.35;animation:drift2 28s ease-in-out infinite alternate}
.waves{position:absolute;left:0;right:0;bottom:6%;width:200%;height:160px;color:var(--accent);opacity:.32;animation:slide 10s linear infinite}
.waves path{transform-box:fill-box;transform-origin:center;animation:breathe 2.4s ease-in-out infinite alternate}
.waves path:nth-child(2){animation-duration:3.1s;animation-delay:-.8s}
.waves path:nth-child(3){animation-duration:1.9s;animation-delay:-1.4s}
@keyframes breathe{0%{transform:scaleY(.35)}100%{transform:scaleY(1.25)}}
.grain{position:absolute;inset:-50%;width:200%;height:200%;opacity:.14;mix-blend-mode:overlay;animation:grain 1.2s steps(4) infinite}
@keyframes drift1{to{transform:translate(120px,180px) scale(1.15)}}
@keyframes drift2{to{transform:translate(-120px,-140px) scale(.9)}}
@keyframes slide{to{transform:translateX(-50%)}}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}100%{transform:translate(0,0)}}

/* ---- layout ---- */
main{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top)) 22px calc(32px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:36px}

header{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);border:1px solid var(--line);padding:7px 12px;border-radius:999px;background:rgba(11,10,9,.5)}
.dot{position:relative;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:blink 1.6s ease-in-out infinite}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--accent);animation:ping 1.6s ease-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.8);opacity:0}}
h1{font-family:Anton,Impact,"Arial Narrow Bold",sans-serif;font-weight:400;font-size:clamp(76px,26vw,112px);line-height:.86;letter-spacing:.01em;margin:4px 0 0;text-transform:uppercase}
h1 span{color:var(--accent)}
.rule{display:flex;align-items:center;gap:10px;width:100%;color:var(--accent)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line))}
.rule::after{background:linear-gradient(270deg,transparent,var(--line))}
.tagline{margin:0;width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-size:14px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.tagline i{font-style:normal;color:var(--accent);padding:0 .6em;letter-spacing:0}
.tl-l{text-align:right;margin-right:-.14em}
.tl-r{text-align:left}

.label{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.label b{color:var(--ink);font-weight:700}

/* ---- tip buttons (hero) ---- */
.tips{display:flex;flex-direction:column;gap:14px}
.tip{position:relative;display:flex;align-items:center;gap:16px;min-height:84px;padding:18px 20px;border-radius:20px;overflow:hidden;isolation:isolate;transition:transform .12s ease,box-shadow .2s ease}
.tip.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 10px 40px -10px var(--accent);animation:glow 3.6s ease-in-out infinite}
.tip.secondary{background:rgba(245,241,234,.06);color:var(--ink);border:1.5px solid var(--accent);box-shadow:0 0 30px -14px var(--accent)}
.tip::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);transform:translateX(-120%);animation:shimmer 4.5s ease-in-out infinite}
.tip.secondary::after{background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.12) 50%,transparent 70%);animation-delay:1.2s}
.tip:active{transform:scale(.97)}
.tip:focus-visible,.follow a:focus-visible,.book:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@keyframes shimmer{0%,55%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
@keyframes glow{50%{box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 14px 56px -8px var(--accent)}}
.ico{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.primary .ico{background:rgba(20,6,0,.14)}
.secondary .ico{background:rgba(245,241,234,.08);color:var(--accent)}
.tip-txt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.tip-name{font-family:Anton,Impact,sans-serif;font-size:30px;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.tip-handle{font-size:14px;font-weight:600;opacity:.82}
.arrow{flex:none;opacity:.9}

/* ---- follow ---- */
.follow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.follow a{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(11,10,9,.55);font-size:15px;font-weight:600;transition:transform .12s ease,border-color .2s ease,background .2s ease}
.follow a:active{transform:scale(.96);border-color:var(--accent);background:rgba(245,241,234,.08)}
.follow svg{color:var(--accent)}

/* ---- footer ---- */
footer{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:6px}
.book{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:12px 22px;border-radius:999px;border:1px dashed rgba(245,241,234,.35);font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.book:active{transform:scale(.97);border-color:var(--accent)}
.thanks{margin:0;font-size:13px;color:var(--muted)}

@media (hover:hover){
  .tip:hover{transform:translateY(-2px)}
  .follow a:hover{border-color:var(--accent)}
  .book:hover{border-color:var(--accent);color:var(--accent)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .tip::after{display:none}
  .dot{animation:blink 1.6s ease-in-out infinite!important}
  .dot::after{display:none}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="blob b1"></div>
  <div class="blob b2"></div>

    <path d="M0 80 Q50 20 100 80 T200 80 T300 80 T400 80 T500 80 T600 80 T700 80 T800 80"/>
    <path d="M0 80 Q50 120 100 80 T200 80 T300 80 T400 80 T500 80 T600 80 T700 80 T800 80" opacity=".6"/>
    <path d="M0 80 Q25 50 50 80 T100 80 T150 80 T200 80 T250 80 T300 80 T350 80 T400 80 T450 80 T500 80 T550 80 T600 80 T650 80 T700 80 T750 80 T800 80" opacity=".4"/>

</body>
